name: CodeQL

on:
  push:
    branches: [main, release/r2.0, release/r2.1]
  pull_request:
    branches: [main, release/r2.0, release/r2.1]
  schedule:
    - cron: '23 14 * * 1'  # Mondays at 14:23 UTC

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    # Dependabot PRs run with a restricted token that cannot upload SARIF.
    # Coverage is provided by push-to-main and the weekly schedule.
    if: github.actor != 'dependabot[bot]'

    strategy:
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f0213c31c702f929cf06ddb900ac315d246a8997  # v4.33.0
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@f0213c31c702f929cf06ddb900ac315d246a8997  # v4.33.0

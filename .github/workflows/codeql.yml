name: CodeQL

on:
  push:
    branches: [main, release/r2.0, release/r2.1]
  pull_request:
    branches: [main, release/r2.0, release/r2.1]
  schedule:
    - cron: '23 14 * * 1'  # Mondays at 14:23 UTC

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f0213c31c702f929cf06ddb900ac315d246a8997  # v4.33.0
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@f0213c31c702f929cf06ddb900ac315d246a8997  # v4.33.0

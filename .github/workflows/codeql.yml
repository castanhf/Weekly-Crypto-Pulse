name: CodeQL

on:
  push:
    branches: [main, release/r2.0, release/r2.1, release/r2.1.1]
  schedule:
    - cron: '23 14 * * 1'  # Mondays at 14:23 UTC

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    # Dependabot PRs run with a restricted token that cannot upload SARIF.
    # Coverage is provided by push-to-main and the weekly schedule.
    if: github.actor != 'dependabot[bot]'
    # Code scanning is enabled in repository Settings > Security.
    # This job is blocking — CodeQL findings must be resolved before merge.

    strategy:
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9

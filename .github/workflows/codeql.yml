name: CodeQL

on:
  push:
    branches: [main, release/r2.0, release/r2.1, release/r2.1.1]
  schedule:
    - cron: '23 14 * * 1'  # Mondays at 14:23 UTC

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    # Dependabot PRs run with a restricted token that cannot upload SARIF.
    # Coverage is provided by push-to-main and the weekly schedule.
    if: github.actor != 'dependabot[bot]'
    # Code scanning is enabled in repository Settings > Security.
    # This job is blocking — CodeQL findings must be resolved before merge.

    strategy:
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa  # v4.36.0
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a  # v4.37.1

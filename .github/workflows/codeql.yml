name: CodeQL

on:
  push:
    branches: [main, release/r2.0, release/r2.1]
  schedule:
    - cron: '23 14 * * 1'  # Mondays at 14:23 UTC

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    # Dependabot PRs run with a restricted token that cannot upload SARIF.
    # Coverage is provided by push-to-main and the weekly schedule.
    if: github.actor != 'dependabot[bot]'
    # continue-on-error: analysis runs for local review; upload requires code scanning to be
    # enabled in repository Settings > Security. Until then, this job is non-blocking.
    continue-on-error: true

    strategy:
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b1bff81932f5cdfc8695c7752dcee935dcd061c8  # v4.33.0
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@b1bff81932f5cdfc8695c7752dcee935dcd061c8  # v4.33.0

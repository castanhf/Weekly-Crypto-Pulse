name: Daily Pipeline

on:
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC every day
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target date (YYYY-MM-DD). Leave blank to default to today UTC.'
        required: false
        type: string

permissions:
  contents: write  # commits the daily artifact
  models: read     # GitHub Models API (primary LLM provider)

concurrency:
  group: daily-pipeline
  cancel-in-progress: false  # queue delayed runs rather than cancel — the daily must ship

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Determine if today is Sunday
        id: day-check
        run: echo "is_sunday=$([ $(date +%u) -eq 7 ] && echo true || echo false)" >> $GITHUB_OUTPUT

      - name: Run daily pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
          BEEHIIV_PUBLICATION_ID: ${{ secrets.BEEHIIV_PUBLICATION_ID }}
          DAILY_TARGET_DATE: ${{ inputs.target_date }}
        run: npm run run:daily-pipeline

      - name: Validate daily artifacts
        run: npm run validate:daily-artifacts

      - name: Commit and push artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dailies/

          if git diff --cached --quiet; then
            echo "No daily artifact changes to commit."
            exit 0
          fi

          DATE_LABEL="${{ inputs.target_date }}"
          COMMIT_DATE="${DATE_LABEL:-$(date +%Y-%m-%d)}"
          git commit -m "chore: add daily artifact ${COMMIT_DATE}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Sunday digest (Sundays only)
        if: steps.day-check.outputs.is_sunday == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
          BEEHIIV_PUBLICATION_ID: ${{ secrets.BEEHIIV_PUBLICATION_ID }}
        run: npm run run:sunday-digest

name: Weekly report automation

on:
  schedule:
    # Runs every Monday at 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-commit-report:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate weekly report artifact
        run: npm run generate:local-report

      - name: Validate generated report artifacts
        run: npm run validate:reports

      - name: Commit artifact updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports

          if git diff --cached --quiet; then
            echo "No report artifact changes to commit."
            exit 0
          fi

          git commit -m "chore: update weekly report artifacts"
          git push
        env:
          # Minimal secret surface: only the default repository token is used for push.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Weekly report automation

on:
  schedule:
    # Runs every Monday at 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  models: read

jobs:
  generate-and-commit-report:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Research and generate weekly report input
        run: npm run generate:report-input
        env:
          # GITHUB_TOKEN is auto-injected by Actions — no extra secrets needed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate weekly report artifact
        run: npm run generate:local-report
        env:
          BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
          BEEHIIV_PUBLICATION_ID: ${{ secrets.BEEHIIV_PUBLICATION_ID }}

      - name: Validate generated report artifacts
        run: npm run validate:reports

      - name: Sync premium artifacts
        run: npm run generate:premium

      - name: Commit artifact updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports

          if git diff --cached --quiet; then
            echo "No report artifact changes to commit."
            exit 0
          fi

          git commit -m "chore: add weekly report artifact $(date +%Y-%m-%d)"
          git push
        env:
          # Minimal secret surface: only the default repository token is used for push.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
